; AI DeskMate — ESP32-S3-N16R8 firmware
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; Before the first build, copy include/secrets.h.example to include/secrets.h
; and fill in your Wi-Fi and backend address. The firmware builds and runs
; without it — it just stays offline, and every local feature still works.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; This board is an N16R8: 16 MB QIO flash + 8 MB OCTAL PSRAM.
; Confirmed with: esptool.py --chip esp32s3 flash_id
;   -> "Features: WiFi, BLE, Embedded PSRAM 8MB (AP_3v3)"
; qio_opi selects the SDK variant for QIO flash + OPI PSRAM. Use qio_qspi
; instead for the 2 MB (quad) R2 variants.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    olikraus/U8g2@^2.36.5
    bblanchon/ArduinoJson@^7.4.2
    links2004/WebSockets@^2.6.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Arduino only initialises PSRAM when this is defined. Without it the chip's
    ; 8 MB is simply never brought up and ESP.getPsramSize() returns 0 — no
    ; error, no warning. Selecting the right memory_type above is necessary but
    ; not sufficient; you need both.
    -DBOARD_HAS_PSRAM
    ; U8g2 ships hundreds of fonts; we use five. This drops the rest from the
    ; binary instead of linking ~200 kB of glyph tables we never draw.
    -DU8G2_USE_LARGE_FONTS=0
    -Wall

; If your board enumerates over native USB (no separate USB-UART chip),
; uncomment these so Serial goes to the USB CDC port.
; build_flags =
;     ${env:esp32-s3.build_flags}
;     -DARDUINO_USB_MODE=1
;     -DARDUINO_USB_CDC_ON_BOOT=1


